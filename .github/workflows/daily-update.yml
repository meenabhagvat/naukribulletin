name: Daily NaukriBulletin.in Update (Phase 4)

on:
  schedule:
    # 3× daily IST: 7 AM (1:30 UTC), 1 PM (7:30 UTC), 7 PM (13:30 UTC)
    - cron: "30 1 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
    # Weekly Sunday 6 AM IST (0:30 UTC) — full state/category page rebuild
    - cron: "30 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 lxml feedparser

      - name: Configure Git
        run: |
          git config --global user.name "NaukriBulletin Bot"
          git config --global user.email "bot@naukribulletin.in"

      - name: Run Job Scraper & Generator
        run: python scripts/scraper.py
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ADSENSE_SLOT_TOP:  ${{ secrets.ADSENSE_SLOT_TOP }}
          ADSENSE_SLOT_MID:  ${{ secrets.ADSENSE_SLOT_MID }}
          INDEXNOW_KEY:      ${{ secrets.INDEXNOW_KEY }}

      - name: SEO hardening pass (schema, ads.txt, enrich, consent, ad-slots, sitemap)
        run: python scripts/seo_perfect.py --apply
        env:
          ADSENSE_SLOT_TOP: ${{ secrets.ADSENSE_SLOT_TOP }}
          ADSENSE_SLOT_MID: ${{ secrets.ADSENSE_SLOT_MID }}

      - name: Commit Scraped Jobs
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "chore: scrape jobs [$(date -u '+%Y-%m-%d %H:%M')] [skip ci]"
          git pull --rebase origin main
          git push
        continue-on-error: true

      - name: Send Telegram + OneSignal Push
        run: python scripts/telegram_notify.py
        env:
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ONESIGNAL_APP_ID:    ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY:  ${{ secrets.ONESIGNAL_REST_KEY }}
          BREVO_API_KEY:       ${{ secrets.BREVO_API_KEY }}
        continue-on-error: true

      - name: Post to WhatsApp Channel
        run: python scripts/whatsapp_post.py
        env:
          WA_PHONE_NUMBER_ID:     ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_ACCESS_TOKEN:        ${{ secrets.WA_ACCESS_TOKEN }}
          WA_CHANNEL_ID:          ${{ secrets.WA_CHANNEL_ID }}
          WA_BUSINESS_ACCOUNT_ID: ${{ secrets.WA_BUSINESS_ACCOUNT_ID }}
        continue-on-error: true

      - name: Commit Notification State
        run: |
          git add scripts/_data/ scripts/tg_posted.json
          git diff --cached --quiet || git commit -m "chore: update notification state [skip ci]"
          git pull --rebase origin main
          git push
        continue-on-error: true

      - name: Sync dist/ for deployment
        run: |
          rsync -a --delete \
            --exclude='.git' --exclude='.github' --exclude='scripts' \
            --exclude='*.py' --exclude='node_modules' --exclude='dist' \
            --exclude='.wrangler' --exclude='.wranglerignore' \
            . dist/

      - name: Deploy to Cloudflare Workers
        run: |
          npm install -g wrangler
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::One or more steps failed — check logs above"
          echo "Failure at $(date -u '+%Y-%m-%d %H:%M UTC')"
