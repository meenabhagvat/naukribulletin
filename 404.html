<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — NaukriBulletin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <!-- OneSignal Web Push -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "89e83d08-e30e-46f9-baec-f0167f8baa35",
        notifyButton: { enable: true, size: 'medium', position: 'bottom-left',
          text: { 'tip.state.unsubscribed': 'Get free job alerts!',
                  'tip.state.subscribed': '✓ Job alerts active',
                  'message.prenotify': 'Get instant govt job alerts' }
        },
        welcomeNotification: {
          title: "NaukriBulletin Alerts ON 🎉",
          message: "You'll get instant alerts for new govt jobs!"
        }
      });
    });
  </script>
</head>
<body style="min-height:100vh; display:flex; flex-direction:column;">

  <nav class="nav-bar">
    <div class="nav-inner">
      <a href="/" class="logo"><span class="logo-dot"></span>NaukriBulletin</a>
    </div>
  </nav>

  <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
    <div style="text-align:center; max-width:500px;">
      <div style="font-size:5rem; margin-bottom:16px;">🔍</div>
      <h1 style="font-family:var(--font-display); font-size:2rem; font-weight:800; color:var(--navy); margin-bottom:12px;">Page Not Found</h1>
      <p style="color:var(--grey-700); margin-bottom:32px; font-size:0.95rem;">This job notification may have expired or the page has moved. Check our latest listings below.</p>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <a href="/jobs/" class="btn-primary">View Latest Jobs</a>
        <a href="/current-affairs/" class="btn-navy">Current Affairs</a>
      </div>
    </div>
  </main>

  <footer style="background:var(--navy); padding:20px; text-align:center;">
    <p style="color:var(--grey-400); font-size:0.8rem;">© 2025 NaukriBulletin.in</p>
  </footer>

</body>
</html>
