  <style>
    .hero{background:linear-gradient(135deg,#0A0F2C 0%,#12184A 100%);padding:48px 20px 36px;text-align:center}
    .hero h1{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;color:#fff;margin:0 0 10px}
    .hero p{color:#9BA3B8;font-size:1rem;margin:0}
    .wrap{max-width:960px;margin:0 auto;padding:0 20px}
    .filter-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:24px 20px 8px;max-width:960px;margin:0 auto}
    .filter-btn{padding:7px 18px;border-radius:20px;border:1.5px solid #ECEEF2;background:#fff;color:#4A5270;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s}
    .filter-btn:hover,.filter-btn.active{background:#FF6B00;color:#fff;border-color:#FF6B00}
    .search-wrap{max-width:420px;margin:16px auto 8px}
    .search-wrap input{width:100%;padding:10px 16px;border-radius:10px;border:1.5px solid #ECEEF2;font-size:.9rem;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box}
    .search-wrap input:focus{border-color:#FF6B00}
    .admit-grid{display:grid;gap:14px;padding:16px 0 48px}
    .admit-card{background:#fff;border-radius:14px;border:1.5px solid #ECEEF2;padding:18px 20px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;transition:box-shadow .2s}
    .admit-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08)}
    .admit-card.available{border-left:4px solid #1AA60A}
    .admit-card.expected{border-left:4px solid #FF6B00}
    .admit-tag{font-size:.7rem;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:4px;display:inline-block;margin-bottom:6px}
    .tag-upsc{background:rgba(21,101,192,.1);color:#1565C0}
    .tag-ssc{background:rgba(255,107,0,.1);color:#E65100}
    .tag-banking{background:rgba(26,166,10,.1);color:#1AA60A}
    .tag-railway{background:rgba(123,31,162,.1);color:#7B1FA2}
    .tag-defence{background:rgba(183,28,28,.1);color:#B71C1C}
    .tag-state{background:rgba(0,105,92,.1);color:#00695C}
    .admit-name{font-family:'Syne',sans-serif;font-size:.98rem;font-weight:700;color:#0A0F2C;margin-bottom:4px}
    .admit-meta{font-size:.8rem;color:#9BA3B8}
    .admit-meta span{margin-right:12px}
    .status-pill{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;margin-top:6px}
    .pill-available{background:rgba(26,166,10,.1);color:#1AA60A}
    .pill-expected{background:rgba(255,107,0,.1);color:#E65100}
    .download-btn{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;background:#FF6B00;color:#fff;border-radius:8px;font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .2s}
    .download-btn:hover{background:#E65100}
    .download-btn.disabled{background:#ECEEF2;color:#9BA3B8;pointer-events:none}
    .no-results{text-align:center;padding:48px;color:#9BA3B8}
    @media(max-width:600px){.admit-card{grid-template-columns:1fr}.hero h1{font-size:1.5rem}}
  </style>
</head>
<body>
  <nav class="nav-bar"><div class="nav-inner"><a href="/" class="logo"><span class="logo-dot"></span>NaukriBulletin</a><div class="nav-links"><a href="/jobs/">Jobs</a><a href="/current-affairs/">Current Affairs</a><a href="/exam-calendar/">Exam Calendar</a><a href="/admit-card/" style="color:#FF6B00;">Admit Card</a><a href="/syllabus/">Syllabus</a></div></div></nav>
  <div class="hero"><h1>🎫 Admit Card Hub 2026</h1><p>Direct official links to download hall tickets — updated daily</p></div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterCards('all',event)">All</button>
    <button class="filter-btn" onclick="filterCards('available',event)">🟢 Available Now</button>
    <button class="filter-btn" onclick="filterCards('upsc',event)">UPSC</button>
    <button class="filter-btn" onclick="filterCards('ssc',event)">SSC</button>
    <button class="filter-btn" onclick="filterCards('banking',event)">Banking</button>
    <button class="filter-btn" onclick="filterCards('railway',event)">Railway</button>
    <button class="filter-btn" onclick="filterCards('defence',event)">Defence</button>
    <button class="filter-btn" onclick="filterCards('state',event)">State PSC</button>
  </div>
  <div class="wrap">
    <div class="search-wrap"><input type="text" id="searchInput" placeholder="🔍 Search exam..." oninput="renderCards()"></div>
    <div class="admit-grid" id="admitGrid"></div>
  </div>
  <script>
  const ADMITS=[{name:"UPSC Civil Services Prelims 2026 Admit Card",category:"upsc",status:"available",examDate:"2026-05-24",link:"https://upsconline.nic.in/",org:"UPSC",note:"e-Admit Card on UPSC website"},{name:"SSC CHSL 2025 Tier I Admit Card",category:"ssc",status:"available",examDate:"2026-06-20",link:"https://ssc.gov.in/",org:"SSC",note:"Download from regional SSC sites"},{name:"IBPS RRB PO 2026 Prelims Admit Card",category:"banking",status:"available",examDate:"2026-08-01",link:"https://ibps.in/",org:"IBPS",note:"Login with Registration No."},{name:"IBPS RRB Clerk 2026 Prelims Admit Card",category:"banking",status:"available",examDate:"2026-08-16",link:"https://ibps.in/",org:"IBPS",note:"Login with Registration No."},{name:"RRB NTPC 2025 CBT 2 Admit Card",category:"railway",status:"available",examDate:"2026-06-18",link:"https://rrbapply.gov.in/",org:"RRB",note:"Download from respective RRB site"},{name:"NDA I 2026 Admit Card",category:"defence",status:"available",examDate:"2026-04-13",link:"https://upsconline.nic.in/",org:"UPSC/NDA",note:"e-Admit Card released"},{name:"UGC NET June 2026 Admit Card",category:"ssc",status:"available",examDate:"2026-06-25",link:"https://ugcnet.nta.ac.in/",org:"NTA",note:"Download from NTA portal"},{name:"UPPSC PCS 2026 Prelims Admit Card",category:"state",status:"available",examDate:"2026-07-27",link:"https://uppsc.up.nic.in/",org:"UPPSC",note:"Download from UPPSC portal"},{name:"Kerala PSC Various Posts Admit Card",category:"state",status:"available",examDate:"2026-06-30",link:"https://thulasi.psc.kerala.gov.in/",org:"Kerala PSC",note:"Thulasi portal login"},{name:"BPSC 70th CCE Mains Admit Card",category:"state",status:"available",examDate:"2026-07-04",link:"https://onlinebpsc.bihar.gov.in/",org:"BPSC",note:"Online BPSC portal"},{name:"IBPS PO 2026 Prelims Admit Card",category:"banking",status:"expected",examDate:"2026-10-04",link:"https://ibps.in/",org:"IBPS",note:"Expected Sep 2026"},{name:"IBPS Clerk 2026 Prelims Admit Card",category:"banking",status:"expected",examDate:"2026-08-23",link:"https://ibps.in/",org:"IBPS",note:"Expected Aug 2026"},{name:"SSC CGL 2026 Tier I Admit Card",category:"ssc",status:"expected",examDate:"2026-09-01",link:"https://ssc.gov.in/",org:"SSC",note:"Expected Aug 2026"},{name:"SBI PO 2026 Prelims Admit Card",category:"banking",status:"expected",examDate:"2026-11-08",link:"https://sbi.co.in/careers",org:"SBI",note:"Expected Oct 2026"},{name:"SBI Clerk 2026 Prelims Admit Card",category:"banking",status:"expected",examDate:"2026-10-10",link:"https://sbi.co.in/careers",org:"SBI",note:"Expected Sep 2026"},{name:"UPSC CDS II 2026 Admit Card",category:"upsc",status:"expected",examDate:"2026-09-13",link:"https://upsconline.nic.in/",org:"UPSC",note:"Expected Aug 2026"},{name:"UPSC CAPF AC 2026 Admit Card",category:"upsc",status:"expected",examDate:"2026-08-02",link:"https://upsconline.nic.in/",org:"UPSC",note:"Expected Jul 2026"},{name:"RBI Grade B 2026 Admit Card",category:"banking",status:"expected",examDate:"2026-07-20",link:"https://opportunities.rbi.org.in/",org:"RBI",note:"Expected Jul 2026"},{name:"IAF Agniveer Vayu 2026 Admit Card",category:"defence",status:"expected",examDate:"2026-07-10",link:"https://agnipathvayu.cdac.in/",org:"IAF",note:"Expected Jun 2026"},{name:"Indian Army Agniveer 2026 Admit Card",category:"defence",status:"expected",examDate:"2026-07-01",link:"https://joinindianarmy.nic.in/",org:"Indian Army",note:"Expected Jun 2026"},{name:"SSC CPO 2026 Admit Card",category:"ssc",status:"expected",examDate:"2026-10-15",link:"https://ssc.gov.in/",org:"SSC",note:"Expected Sep 2026"},{name:"SSC MTS 2026 Admit Card",category:"ssc",status:"expected",examDate:"2026-10-01",link:"https://ssc.gov.in/",org:"SSC",note:"Expected Sep 2026"},{name:"RPSC RAS 2026 Prelims Admit Card",category:"state",status:"expected",examDate:"2026-10-25",link:"https://rpsc.rajasthan.gov.in/",org:"RPSC",note:"Expected Oct 2026"},{name:"TNPSC Group 1 2026 Admit Card",category:"state",status:"expected",examDate:"2026-08-10",link:"https://tnpscexams.in/",org:"TNPSC",note:"Expected Jul 2026"},{name:"WBPSC WBCS 2026 Prelims Admit Card",category:"state",status:"expected",examDate:"2026-08-24",link:"https://wbpsc.gov.in/",org:"WBPSC",note:"Expected Aug 2026"},{name:"UPSC Civil Services Mains 2026 Admit Card",category:"upsc",status:"expected",examDate:"2026-09-19",link:"https://upsconline.nic.in/",org:"UPSC",note:"Expected Sep 2026"},{name:"RRB Group D 2026 Admit Card",category:"railway",status:"expected",examDate:"2026-12-01",link:"https://rrbapply.gov.in/",org:"RRB",note:"Expected Nov 2026"}];
  let currentFilter='all';
  function filterCards(f,e){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));if(e&&e.target)e.target.classList.add('active');renderCards()}
  function renderCards(){const q=(document.getElementById('searchInput').value||'').toLowerCase();let data=[...ADMITS];if(currentFilter==='available')data=data.filter(d=>d.status==='available');else if(currentFilter!=='all')data=data.filter(d=>d.category===currentFilter);if(q)data=data.filter(d=>d.name.toLowerCase().includes(q)||d.org.toLowerCase().includes(q));data.sort((a,b)=>{if(a.status==='available'&&b.status!=='available')return -1;if(b.status==='available'&&a.status!=='available')return 1;return new Date(a.examDate)-new Date(b.examDate)});if(!data.length){document.getElementById('admitGrid').innerHTML='<div class="no-results">No admit cards found.</div>';return}
  document.getElementById('admitGrid').innerHTML=data.map(d=>{const isAvailable=d.status==='available';const cardClass=isAvailable?'available':'expected';const pillClass=isAvailable?'pill-available':'pill-expected';const pillText=isAvailable?'🟢 Available Now':'🟠 Expected Soon';const btnClass=isAvailable?'':'disabled';const btnText=isAvailable?'⬇ Download':'⏳ Not Yet';const examDateStr=new Date(d.examDate).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});return`<div class="admit-card ${cardClass}" data-category="${d.category}"><div><span class="admit-tag tag-${d.category}">${d.category.toUpperCase()}</span><div class="admit-name">${d.name}</div><div class="admit-meta"><span>🏛️ ${d.org}</span><span>📅 Exam: ${examDateStr}</span><span>📝 ${d.note}</span></div><span class="status-pill ${pillClass}">${pillText}</span></div><a href="${d.link}" target="_blank" rel="noopener" class="download-btn ${btnClass}">${btnText}</a></div>`}).join('')}
  renderCards();
  </script>
